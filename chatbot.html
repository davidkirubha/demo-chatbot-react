<!DOCTYPE html>
<html>
    <head>
        <title>Chatbot</title>
        <style>
            body{
                font-family: arial;
                margin-top: 0px;
                margin-bottom: 0px;
                
            }
            .send-button{
                background-color:orangered;
                border: none;
                border-radius: 10px;
                padding: 15px;
                color: white;
                margin: 10px;
            }
            .chatinput{
             
                border-radius: 5px;
                font-size: 15px;
                 flex-grow: 1;

            }
           .chatinput:focus {
                    border: 2px solid lightblue;
                    outline: none;
}
.chat-input-container{
    display: flex;
    margin-bottom: 50px;  
  
}
.app-container{
    width: 100%;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
.chat-message-user{
    display: flex;
    justify-content: end;
   
}
.chat-message-CM{
    display: flex;
   
}
.chat-message-text{
    background-color: grey;
    max-width: 400px;
    border: none;
    border-radius:5px ;
    color: white;
    margin: 10px;
    padding: 10px;
}
.chat-message-profile{
width: 40px;
border-radius: 10px;
height: 40px;
}
.chat-messages-container{
    flex-grow: 1;
    margin-top: 20px;
    overflow: scroll;
    scrollbar-width: none;
    
}
        </style>
    </head>
    <body>
        <div class="js-container"></div>

        <script src="https://unpkg.com/supersimpledev/react.js"></script>
        <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

        <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>


        <script src="https://unpkg.com/supersimpledev/babel.js"></script>
        <script type="text/babel">


function ChatInput({chatMessages,setChatMessages}){

const[inputText,setInputText]= React.useState('');

function saveInputText(event){

setInputText(event.target.value);

}

function sendMessage(){

const newChatMessages=[
    ...chatMessages,
    {                           //alter of push we use spread operator.
        message:inputText,
        sender:'vijay',
        id:crypto.randomUUID()
    }
   ]

      setChatMessages(newChatMessages);

    const response= Chatbot.getResponse(inputText);
          setChatMessages([
    ...newChatMessages,
    {                           //alter of push we use spread operator.
        message:response,
        sender:'CM',
        id:crypto.randomUUID()
    }
   ]);


   setInputText('');
}

    return( 
        <div className="chat-input-container">
        <input placeholder="Send a message to Chatbot" size="30"
        onChange=
            {saveInputText}
            value={inputText}
            className="chatinput"
                />
        <button onClick={sendMessage}
        className="send-button"
        > send </button>
        </div>
    );
}


function ChatMessage({message,sender}){


    return (
        <div className={sender === 'vijay' ? 'chat-message-user' :'chat-message-CM'}>

            {sender ==='CM' &&     <img src="CM.jpg" className= 'chat-message-profile' /> }

            <div className="chat-message-text">

           {message}

           </div>

            { sender ==='vijay'  && <img src="vijay.jpg" className= 'chat-message-profile' />}
        </div>
    );
}


function ChatMessages({chatMessages})
{
  const chatMessagesRef =  React.useRef(null);

React.useEffect(()=>{
 const containerElem = chatMessagesRef.current;
 if(containerElem){
    containerElem.scrollTop=containerElem.scrollHeight;
 }

},[chatMessages]);


return(
<div className="chat-messages-container" ref={chatMessagesRef}>


 {chatMessages.map((chatMessage)=>{
     return(
        <ChatMessage            
        message={chatMessage.message}
        sender={chatMessage.sender}
        key={chatMessage.id}
        />
     );
})}
</div>
);
}


function App(){

    const[chatMessages,setChatMessages] = React.useState([
    {
        message:'hello chatbot',
        sender:'vijay',
        id:'id1'
    },{
    message:'Hello How can i help you?',
    sender:'CM',
    id:'id2'
},{
    message:'can you get me today date?',
    sender:'vijay',
    id:'id3'
},{
    message:'today is november 11',
    sender:'CM',
    id:'id4'
}
]
    );


    return (
       <div className="app-container">

    
    <ChatMessages 
    chatMessages={chatMessages}  
    />
     <ChatInput
          chatMessages={chatMessages}
          setChatMessages={setChatMessages}
     
     />
     
    </div>

    );
}

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
      
    </script>
    </body>
</html>
